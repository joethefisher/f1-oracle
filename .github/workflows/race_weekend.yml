name: F1 Oracle — Race Weekend Automation

on:
  schedule:
    # Race weekend window: every 30 min Thu–Sun (UTC)
    - cron: "*/30 * * * 0,4,5,6"
    # Early-week: once daily Mon–Wed to catch markets opening ~7 days pre-race
    - cron: "0 9 * * 1,2,3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, no DB writes)"
        required: false
        default: "false"
      race_id:
        description: "Force a specific race ID (optional)"
        required: false
        default: ""

jobs:
  gate:
    name: Race Week Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      active: ${{ steps.chk.outputs.active }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psycopg
        run: pip install "psycopg[binary]"

      - name: Check for active race week
        id: chk
        run: python tools/race_gate.py >> $GITHUB_OUTPUT
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  orchestrate:
    name: Run Orchestrator
    needs: gate
    if: needs.gate.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Needed to commit retrained model artifacts back after a race settles.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get cache key month
        id: month
        run: echo "val=$(date +'%Y-%m')" >> $GITHUB_OUTPUT

      - name: Restore FastF1 cache
        uses: actions/cache@v4
        with:
          path: .tmp/fastf1_cache
          # Rotate monthly to avoid stale data across seasons
          key: fastf1-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ steps.month.outputs.val }}
          restore-keys: |
            fastf1-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-

      - name: Create cache directory
        run: mkdir -p .tmp/fastf1_cache

      - name: Run orchestrator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          RACE_ID_ARG=""
          if [ -n "${{ github.event.inputs.race_id }}" ]; then
            RACE_ID_ARG="--race-id ${{ github.event.inputs.race_id }}"
          fi
          python -m tools.orchestrate $RACE_ID_ARG

      # Commit retrained models back to the repo. Orchestrator step 9 retrains
      # only once per race (guarded on model_metrics), and training is
      # deterministic, so this commits only when new race data changed the
      # artifacts. [skip ci] avoids retriggering the test workflow.
      - name: Commit retrained models
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "f1-oracle-bot"
          git config user.email "f1-oracle-bot@users.noreply.github.com"
          git add models/
          if git diff --cached --quiet; then
            echo "No model changes to commit"
          else
            git commit -m "chore: retrain models after race [skip ci]"
            git push
          fi

      # Always save cache so subsequent runs benefit even if this run had errors
      - name: Save FastF1 cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .tmp/fastf1_cache
          key: fastf1-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ steps.month.outputs.val }}
