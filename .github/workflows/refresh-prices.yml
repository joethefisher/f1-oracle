name: F1 Oracle — Kalshi Price Refresh

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours, all year
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, no DB writes)"
        required: false
        default: "false"

jobs:
  refresh:
    name: Refresh Kalshi Prices
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install "psycopg[binary]" requests

      - name: Refresh prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m tools.refresh_prices
